services:
  # Database PostgreSQL
  postgres:
    image: postgres:13-alpine
    container_name: bytebridge-postgres
    environment:
      POSTGRES_DB: bytebridge
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: bytebridge
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - bytebridge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bytebridge"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Applicazione WebService
  webservice:
    image: inserireilmiousernamedockerhub/bytebridge:latest
    container_name: bytebridge
    environment:
      # Database configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://bytebridge-postgres:5432/bytebridge
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: bytebridge

      # JPA/Hibernate configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_SHOW_SQL: true

      # Server configuration
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080

      # Application configuration
      APP_UPLOAD_DIR: /app/uploads

      # Chrome configuration
      CHROME_PATH: /usr/bin/google-chrome

      # Java options
      JAVA_OPTS: -Xmx4096m -Djava.security.egd=file:/dev/./urandom

      # Logging
      LOGGING_LEVEL_WEBSERVICE: INFO
    volumes:
      - uploads_volume:/app/uploads
      - temp_volume:/app/temp
      - logs_volume:/app/logs
    ports:
      - "8080:8080"
    networks:
      - bytebridge-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/converter/status || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # PgAdmin per gestione database (opzionale)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bytebridge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bytebridge.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - bytebridge-network
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - admin

# Volumi persistenti
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  uploads_volume:
    driver: local
  temp_volume:
    driver: local
  logs_volume:
    driver: local

networks:
  bytebridge-network:
    driver: bridge